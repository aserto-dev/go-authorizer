---
version: v2

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: .
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.6.2
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  - remote: buf.build/grpc-ecosystem/gateway:v2.31.0
    out: .
    opt:
      - paths=source_relative
      - logtostderr=true
      - generate_unbound_methods=true

  - remote: buf.build/grpc-ecosystem/openapiv2:v2.31.0
    out: ./tmp/
    opt:
      - json_names_for_fields=false  # use proto names.
      - allow_delete_body=true       # DELETE requests may have a body.
      - simple_operation_ids=true    # Remove service prefix from operation IDs.
      - enable_rpc_deprecation=true  # process grpc method's deprecated options.

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ./docs
    opt: 
      - markdown,api.md

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ./html
    opt:
      - html,index.html
