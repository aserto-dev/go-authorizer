---
version: v2

plugins:
  - remote: buf.build/grpc-ecosystem/gateway:v2.33.0
    out: .
    opt:
      - paths=source_relative
      - logtostderr=true
      - generate_unbound_methods=true

  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: .
    opt: 
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.6.2
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ./docs
    opt: 
      - markdown,api.md

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ./html
    opt:
      - html,index.html

  - remote: buf.build/grpc-ecosystem/openapiv3:v2.33.0
    out: ./.tmp/openapi
    opt:
